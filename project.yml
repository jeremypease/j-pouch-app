name: JPouch
options:
  bundleIdPrefix: com.jeremypease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  JPouch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JPouch
        excludes:
          - "Resources/Info.plist"
    entitlements:
      path: JPouch/JPouch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jeremypease.jpouch]
    info:
      path: JPouch/Resources/Info.plist
      properties:
        CFBundleDisplayName: J-Pouch
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "J-Pouch reads your water intake and weight from Health to track hydration and spot dehydration trends."
        NSHealthUpdateUsageDescription: "J-Pouch writes the water intake you log to Health so it's saved with the rest of your health data."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremypease.jpouch
        PRODUCT_NAME: JPouch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37GS5LK7P7
schemes:
  JPouch:
    build:
      targets:
        JPouch: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
