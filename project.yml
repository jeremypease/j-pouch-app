name: JPouch
options:
  bundleIdPrefix: com.jeremypease
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  JPouch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JPouch
        excludes:
          - "Resources/Info.plist"
    entitlements:
      path: JPouch/JPouch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jeremypease.jpouch]
        # Shared with JPouchWidget so both can open the same SwiftData store (see
        # PersistenceSetup.swift). Must also be enabled on the App ID in the Apple Developer
        # portal for team S6M9LCA6DC — xcodegen/Xcode can't do that part.
        com.apple.security.application-groups: [group.com.jeremypease.jpouch]
    dependencies:
      - target: JPouchWidget
        embed: true
    info:
      path: JPouch/Resources/Info.plist
      properties:
        CFBundleDisplayName: J-Pouch
        CFBundleIconName: AppIcon
        # Without these the generated plist keeps xcodegen's default 1.0/1 and silently
        # ignores MARKETING_VERSION, so the app reported a version nobody set.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Registers the design system's brand fonts (see JPouch/Resources/Fonts/, OFL-licensed —
        # LICENSE-Manrope.txt / LICENSE-IBMPlex.txt) so JP.Font's Font.custom calls (in
        # JPouch/Design/Typography.swift) can find them. xcodegen bundles the .ttf files
        # themselves automatically as resources since they live under the JPouch sources path.
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
        NSHealthShareUsageDescription: "J-Pouch reads your water intake and weight from Health to track hydration and spot dehydration trends."
        NSHealthUpdateUsageDescription: "J-Pouch writes the water intake you log to Health so it's saved with the rest of your health data."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremypease.jpouch
        PRODUCT_NAME: JPouch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        # Fallback only. The real build number is stamped from the git commit count by the
        # postBuildScript below, so App Store Connect never sees a duplicate.
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Team ID from the paid membership, not from a certificate in the keychain — the
        # keychain also holds a personal-team cert whose identifier looks equally plausible,
        # and using that one made signing fail with "No Account for Team".
        DEVELOPMENT_TEAM: S6M9LCA6DC
        # The "Stamp build number from git" postBuildScript below edits the already-built
        # Info.plist in place — it doesn't declare that as an output (doing so collides
        # with the standard ProcessInfoPlistFile step that already produces it, causing a
        # "Multiple commands produce Info.plist" build error). Without a declared output,
        # Xcode's User Script Sandboxing (on by default since Xcode 15) blocks the write
        # with "Operation not permitted", so sandboxing is disabled for the target instead.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp build number from git
        # Runs before code signing, so editing the built plist here is safe.
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || exit 0
          # Commit count only ever increases, which is exactly what App Store Connect wants.
          # If CI is ever added, it must do a full clone: a shallow one (--depth 1) counts
          # only the commits it fetched, which would go backwards and collide with a build
          # already uploaded.
          # If git isn't available (e.g. building from an exported source drop), leave the
          # value from project.yml rather than failing the build.
          if BUILD_NUMBER=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null) && [ -n "$BUILD_NUMBER" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
            echo "Stamped CFBundleVersion $BUILD_NUMBER"
          fi
  JPouchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JPouchTests
    dependencies:
      - target: JPouch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremypease.jpouch.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
  JPouchWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JPouchWidget
      # Shares the schema and container setup with the app rather than duplicating it — the
      # widget process needs to open the exact same SwiftData store. GIReport.swift is excluded:
      # it isn't part of the persisted schema and pulls in PatternAnalyzer (Services), which the
      # widget target doesn't otherwise need.
      - path: JPouch/Models
        excludes:
          - "GIReport.swift"
      - path: JPouch/Services/PersistenceSetup.swift
    # DIAGNOSTIC: entitlements block temporarily removed entirely to test whether the App Group
    # capability is what's tripping CoreSimulator's extension-placeholder install (still failing
    # identically after ruling out widget content and the Info.plist generation mechanism — see
    # PR #7 / plan "Follow-up 2"). Restore once this narrows it down.
    info:
      path: JPouchWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremypease.jpouch.widget
        PRODUCT_NAME: JPouchWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S6M9LCA6DC
        SKIP_INSTALL: YES
        # DIAGNOSTIC: try Xcode's own widget-extension template combination
        # (GENERATE_INFOPLIST_FILE + INFOPLIST_FILE merge, INFOPLIST_KEY_* for flat keys) instead
        # of relying on `info: path:` alone, to see whether that's what CoreSimulator's
        # extension-placeholder creation wants — CI has failed identically without this. See
        # PR #7 / plan "Follow-up 2".
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: J-Pouch
schemes:
  JPouch:
    build:
      targets:
        JPouch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JPouchTests
    archive:
      config: Release
