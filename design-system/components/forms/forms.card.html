<html><head><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-bg)}.wrap{display:flex;gap:20px;padding:18px;flex-wrap:wrap}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.JPouchDesignSystem_6e602e;
function Demo(){
  const [ck,setCk]=React.useState(true);
  const [rd,setRd]=React.useState('formed');
  const [sw,setSw]=React.useState(true);
  return <div className="wrap">
    <div style={{display:'flex',flexDirection:'column',gap:14,width:220}}>
      <Input label="Dose (mg)" suffix="mg" mono defaultValue={2}/>
      <Input label="Note" placeholder="Optional note" error="" helper="Visible to only you"/>
      <Select label="Consistency" value="formed" options={[{label:'Liquid',value:'liquid'},{label:'Formed',value:'formed'},{label:'Loose',value:'loose'}]}/>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Checkbox label="Cramping" checked={ck} onChange={e=>setCk(e.target.checked)}/>
      <Checkbox label="Nausea" checked={false}/>
      <Radio label="Formed" checked={rd==='formed'} onChange={()=>setRd('formed')}/>
      <Radio label="Liquid" checked={rd==='liquid'} onChange={()=>setRd('liquid')}/>
      <Switch label="Hydration reminders" checked={sw} onChange={e=>setSw(e.target.checked)}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
