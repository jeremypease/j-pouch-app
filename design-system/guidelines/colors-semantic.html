<body><div class="row">
<div class="chip" style="background:var(--color-success-soft);color:var(--teal-700)">Success</div>

<div class="chip" style="background:var(--color-danger-soft);color:var(--red-600)">Danger</div>
<div class="chip" style="background:var(--color-info-soft);color:var(--blue-600)">Info</div>
</div></body></html>
