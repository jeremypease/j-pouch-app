<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html,body{margin:0;height:100%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
.phone{width:390px;height:780px;background:var(--color-bg);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;position:relative}
</style>
</head>
<body>
<div class="phone"><div id="root" class="screen"></div></div>
<script type="text/babel" src="Onboarding.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="LogEntry.jsx"></script>
<script type="text/babel" src="Insights.jsx"></script>
<script type="text/babel" src="Profile.jsx"></script>
<script type="text/babel">
const { TabBar } = window.JPouchDesignSystem_6e602e;
function App() {
  const [onboarded, setOnboarded] = React.useState(false);
  const [tab, setTab] = React.useState('home');
  const [logging, setLogging] = React.useState(false);
  const [toast, setToast] = React.useState(false);
  if (!onboarded) return <window.Onboarding onDone={() => setOnboarded(true)} />;
  if (logging) return <window.LogEntry onBack={() => setLogging(false)} onSave={() => { setLogging(false); setToast(true); setTimeout(() => setToast(false), 2200); }} />;
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, minHeight: 0 }}>
        {tab === 'home' && <window.Home onOpenEntry={() => setLogging(true)} />}
        {tab === 'insights' && <window.Insights />}
        {tab === 'profile' && <window.Profile />}
      </div>
      <TabBar items={[{ label: 'Home', value: 'home', icon: 'home' }, { label: 'Log', value: 'log', icon: 'plus-circle' }, { label: 'Insights', value: 'insights', icon: 'bar-chart-2' }, { label: 'Profile', value: 'profile', icon: 'user' }]}
        active={tab} onChange={v => v === 'log' ? setLogging(true) : setTab(v)} />
      {toast && <div style={{ position: 'absolute', bottom: 100, left: '50%', transform: 'translateX(-50%)', zIndex: 40 }}>
        <div style={{ background: 'var(--gray-900)', color: '#fff', padding: '12px 18px', borderRadius: 'var(--radius-md)', boxShadow: 'var(--shadow-lg)', fontSize: 'var(--text-sm)' }}>Output logged</div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
